name: dbt CI

on:
  pull_request:
    paths: ["dbt/**", "knowledge/**", ".github/workflows/dbt-ci.yml"]
  push:
    branches: [main]
    paths: ["dbt/**", "knowledge/**", ".github/workflows/dbt-ci.yml"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      # Dummy credentials: `dbt parse` never opens a connection.
      SNOWFLAKE_ACCOUNT: ci-dummy
      SNOWFLAKE_USER: ci-dummy
      SNOWFLAKE_PASSWORD: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Seeds are reproducible from the generator
        run: |
          python scripts/generate_seeds.py > /dev/null
          git diff --exit-code -- seeds/

      - name: Install dbt packages
        run: dbt deps

      - name: Parse against the Snowflake adapter
        run: |
          cp profiles.example.yml profiles.yml
          dbt parse --profiles-dir .
          rm profiles.yml

      - name: Compile on DuckDB
        run: dbt compile --profiles-dir ci

      - name: Smoke test (build DAG + run all data tests on DuckDB)
        run: python scripts/smoke_test_duckdb.py

      - name: Knowledge base is current (lab catalog regenerated, references resolve)
        run: |
          python scripts/build_lab_catalog.py
          git diff --exit-code -- ../knowledge/lab-catalog.md
          python scripts/check_knowledge_refs.py
